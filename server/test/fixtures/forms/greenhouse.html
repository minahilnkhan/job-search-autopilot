<!doctype html><html><head><meta charset="utf-8"></head><body>
<h1>Software Engineer</h1>
<form id="application-form">
  <div><label id="first_name-label" for="first_name">First Name<span aria-hidden="true">*</span></label><input id="first_name" type="text" aria-required="true" autocomplete="given-name"></div>
  <div><label for="last_name">Last Name<span>*</span></label><input id="last_name" type="text" aria-required="true" autocomplete="family-name"></div>
  <div><label for="email">Email<span>*</span></label><input id="email" type="text" aria-required="true" autocomplete="email"></div>
  <div><label for="country">Country</label><div class="select__control"><div class="select__single-value"></div><input id="country" role="combobox" class="select__input" data-options="United States|Canada|Pakistan"></div></div>
  <div><label for="phone">Phone</label><input id="phone" type="tel" autocomplete="tel"></div>
  <div class="file-upload"><div id="upload-label-resume" class="label">Resume/CV<span>*</span></div><button type="button">Attach</button><input id="resume" type="file" style="position:absolute;width:1px;height:1px;opacity:0" aria-labelledby="upload-label-resume" aria-required="true"></div>
  <div class="file-upload"><div id="upload-label-cover_letter" class="label">Cover Letter</div><button type="button">Attach</button><input id="cover_letter" type="file" style="position:absolute;width:1px;height:1px;opacity:0" aria-labelledby="upload-label-cover_letter"></div>
  <div><label for="question_1">LinkedIn Profile</label><input id="question_1" type="text"></div>
  <div><label for="question_2">Website</label><input id="question_2" type="text"></div>
  <div><label for="question_3">Are you legally authorized to work in the United States?<span>*</span></label><div class="select__control"><div class="select__single-value"></div><input id="question_3" role="combobox" class="select__input" aria-required="true" data-options="Yes|No"></div></div>
  <div><label for="question_4">Will you now or in the future require sponsorship for employment visa status (e.g., H-1B visa status)?<span>*</span></label><div class="select__control"><div class="select__single-value"></div><input id="question_4" role="combobox" class="select__input" aria-required="true" data-options="Yes|No"></div></div>
  <div><label for="question_5">How did you hear about us?</label><input id="question_5" type="text"></div>
  <div><label for="question_6">Why do you want to work at Acme?<span>*</span></label><textarea id="question_6" aria-required="true"></textarea></div>
  <div><label for="question_7">When is the earliest you could start?</label><input id="question_7" type="text"></div>
  <fieldset><legend>Voluntary Self-Identification</legend>
    <div><label for="gender">Gender</label><div class="select__control"><div class="select__single-value"></div><input id="gender" role="combobox" class="select__input" data-options="Female|Male|Decline to self identify"></div></div>
    <div><label for="veteran_status">Veteran Status</label><select id="veteran_status"><option value="">Select...</option><option value="1">I am not a protected veteran</option></select></div>
  </fieldset>
  <button type="submit">Submit application</button>
</form>
<script src="combobox.js"></script>
</body></html>
